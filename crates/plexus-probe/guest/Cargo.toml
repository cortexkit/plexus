[package]
name = "plexus-probe-guest"
version = "0.1.0"
edition = "2024"
publish = false
description = "QuickJS-NG WASI guest embedded in the plexus-probe sandbox"
license = "MIT"
repository = "https://github.com/cortexkit/plexus"

[workspace]

[dependencies]
rquickjs = { version = "0.12.2", features = ["macro"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
