file = "crates/plexus-module/src/lib.rs"
old = "self.0.clear();"
new = "let _ = &self.0; /* NON-VACUITY BREAK */"
test_file = "crates/plexus-module/src/wire_safety_tests.rs"
runner = "cargo"
package = "plexus-module"
target = "--lib"
select = "expected"
expect_red = ["wire_safety_tests::daemon_goodbye_clears_bindings_but_request_error_and_cancel_do_not"]
build_timeout_s = 3600
timeout_s = 120

[[control]]
id = "module-rebind-replaces-released-epoch"
guards = "A new daemon bind for one channel replaces its released epoch without dropping other channels"
file = "crates/plexus-module/src/lib.rs"
old = "routes.retain(|(bound_channel, _), _| *bound_channel != channel);"
new = "routes.retain(|_, _| true); /* NON-VACUITY BREAK */"
test_file = "crates/plexus-module/src/wire_safety_tests.rs"
runner = "cargo"
package = "plexus-module"
target = "--lib"
select = "expected"
expect_red = ["wire_safety_tests::rebinding_a_channel_replaces_the_released_epoch"]
build_timeout_s = 3600
timeout_s = 120

[[control]]
id = "module-deadline-requires-explicit-recall"
guards = "After a waiting tool call exceeds its deadline, its approval stays unused until the agent repeats the same call; the scheduler cannot execute it"
file = "crates/plexus-core/src/governance.rs"
old = "if denial.clears_by_waiting() && !recall_only {"
new = "if denial.clears_by_waiting() && true { /* NON-VACUITY BREAK */"
test_file = "crates/plexus-module/src/consent_capacity_tests.rs"
runner = "cargo"
package = "plexus-module"
target = "--lib"
select = "expected"
expect_red = ["consent_capacity_tests::expired_consent_request_keeps_approval_without_dispatching"]
build_timeout_s = 3600
timeout_s = 120
