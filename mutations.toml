new = "conn.execute(\"UPDATE trigger_subscriptions SET status='suspended',suspended_reason='repository_identity_changed',generation=generation+1\n            WHERE status='active' AND lower(json_extract(fixed_args,'$.owner') || '/' || json_extract(fixed_args,'$.repo'))=lower(?1)\", [&repo])?; /* NON-VACUITY BREAK */"
