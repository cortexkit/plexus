[package]
name = "bellard-eval"
version = "0.1.0"
edition = "2024"
publish = false
description = "Bellard QuickJS arm of the Plexus JavaScript interpreter evaluation"
license = "MIT"
repository = "https://github.com/cortexkit/plexus"

[dependencies]
quickjs_runtime = { version = "0.17.2", default-features = false, features = ["bellard"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6.0"
